name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret Leak Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block tracked .env files
        run: |
          TRACKED=$(git ls-files | grep -E '\.env($|\.)' | grep -v '\.env\.example$' || true)
          if [ -n "$TRACKED" ]; then
            echo "::error::Gizli dosyalar repoda takip ediliyor:"
            echo "$TRACKED"
            exit 1
          fi
          echo "Secret dosya kontrolu basarili."

  backend:
    name: Backend Test & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Coverage ozeti
        if: always()
        run: |
          node <<'NODE'
          const fs = require('fs');
          const summaryPath = process.env.GITHUB_STEP_SUMMARY;
          const coveragePath = 'coverage/coverage-summary.json';

          if (!fs.existsSync(coveragePath)) {
            fs.appendFileSync(summaryPath, '### Backend Test Coverage\n\nRapor bulunamadi.\n');
            process.exit(0);
          }

          const { total } = JSON.parse(fs.readFileSync(coveragePath, 'utf8'));
          const fmt = (metric) => `${metric.pct}% (${metric.covered}/${metric.total})`;
          const markdown = [
            '### Backend Test Coverage',
            '',
            '| Metrik | Oran |',
            '|--------|------|',
            `| Satirlar | ${fmt(total.lines)} |`,
            `| Fonksiyonlar | ${fmt(total.functions)} |`,
            `| Dallar | ${fmt(total.branches)} |`,
            `| Ifadeler | ${fmt(total.statements)} |`,
            '',
            'Detayli HTML rapor: bu workflow run → **Artifacts** → `coverage-report`',
          ].join('\n');

          fs.appendFileSync(summaryPath, `${markdown}\n`);
          NODE

      - name: Coverage raporunu kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: backend/coverage/
          retention-days: 14

      - name: Security lint
        run: npm run lint:security

      - name: Security audit (high+)
        run: npm run audit:check

  frontend:
    name: Frontend Lint, Build & Security
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Security audit (high+)
        run: npm run audit:check

  deploy:
    name: Deploy to Production
    needs: [secret-scan, backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy via SSH
        run: |
          ssh -o StrictHostKeyChecking=yes "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" << 'ENDSSH'
          set -euo pipefail
          export PATH="/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:${PATH:-}"
          export APP_DIR="/home/beratav/fullstack-eticaret"
          export DEPLOY_SOURCE="github-actions"
          export DEPLOY_BRANCH="main"
          cd "$APP_DIR"
          bash scripts/deploy.sh
          ENDSSH
